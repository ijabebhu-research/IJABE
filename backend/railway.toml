[build]
builder = "RAILPACK"
buildCommand = "npm ci && npm run prisma:generate:production && npm run build"

[deploy]
preDeployCommand = "npm run prisma:migrate:production"
startCommand = "npm run start"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
